<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found — KhanaBook POS">
  <meta name="robots" content="noindex, follow">
  <title>404 — Page Not Found | KhanaBook</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon-64.png">
  <link rel="apple-touch-icon" href="../assets/favicon-64.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"></noscript>
  <link rel="stylesheet" href="../css/critical.css">
  <link rel="stylesheet" href="../css/home-v2.css?v=9" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="../css/home-v2.css?v=9"></noscript>
  <script>
    (function(){try{var t=localStorage.getItem('khana-theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');if(t==='dark')document.documentElement.classList.add('dark');}catch(e){}})();
  </script>
  <link rel="stylesheet" href="../css/pages.css?v=1" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="../css/pages.css?v=1"></noscript>
</head>
<body class="page-404" data-page-version="1.2.0">
  <main id="main-content">
    <div class="error-page">
      <div class="error-bg" aria-hidden="true">
        <div class="error-bg-blob error-bg-blob-1"></div>
        <div class="error-bg-blob error-bg-blob-2"></div>
      </div>
      <div class="error-inner">
        <div class="error-code" aria-hidden="true">404</div>
        <div class="error-icon">
          <span class="material-symbols-outlined" aria-hidden="true">search_off</span>
        </div>
        <h1>Looks like you're in the wrong place</h1>
        <p>This page doesn't exist — maybe it moved or we broke something. Either way, let's get you where you need to go.</p>
        <div class="error-search" role="search">
          <input type="text" id="error-search-input" placeholder="Search KhanaBook pages..." aria-label="Search the site">
          <button onclick="handleErrorSearch()">Search</button>
        </div>
        <div class="error-actions">
          <a href="home.html" class="btn-primary">
            <span class="material-symbols-outlined" style="font-size:1.1rem" aria-hidden="true">home</span>
            Back to Home
          </a>
          <a href="get-started.html" class="btn-secondary">
            <span class="material-symbols-outlined" style="font-size:1.1rem" aria-hidden="true">support</span>
            Contact Support
          </a>
        </div>
        <div class="popular-links">
          <span style="font-size:.875rem;color:var(--text-muted)">Popular:</span>
          <a href="features.html">Features</a>
          <a href="pricing-plans.html">Pricing</a>
          <a href="our-story.html">About Us</a>
          <a href="help-center.html">Help Center</a>
          <a href="blog.html">Blog</a>
          <a href="roi-calculator.html">ROI Calculator</a>
          <a href="compare.html">Compare POS</a>
        </div>
      </div>
    </div>
  </main>
  <script>
    var sitePages = [
      { title: 'Home', url: 'home.html' },
      { title: 'Features', url: 'features.html' },
      { title: 'Pricing', url: 'pricing-plans.html' },
      { title: 'Blog', url: 'blog.html' },
      { title: 'Our Story', url: 'our-story.html' },
      { title: 'Help Center', url: 'help-center.html' },
      { title: 'Contact', url: 'contact-us.html' },
      { title: 'Privacy Policy', url: 'privacy-policy.html' },
      { title: 'Terms &amp; Conditions', url: 'terms-and-conditions.html' },
      { title: 'Refund Policy', url: 'refund-policy.html' },
      { title: 'ROI Calculator', url: 'roi-calculator.html' },
      { title: 'Compare POS Systems', url: 'compare.html' }
    ];
    function handleErrorSearch() {
      var q = document.getElementById('error-search-input').value.toLowerCase().trim();
      if (!q) return;
      var match = sitePages.filter(function(p) { return p.title.toLowerCase().indexOf(q) !== -1; });
      if (match.length) {
        window.location.href = match[0].url;
      } else {
        window.location.href = 'home.html';
      }
    }
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('error-search-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') handleErrorSearch();
      });
    });
  </script>
  <script defer src="../js/site.js?v=9"></script>
</body>
</html>
