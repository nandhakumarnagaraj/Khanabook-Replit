<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found — KhanaBook POS">
  <meta name="robots" content="noindex, follow">
  <title>404 — Page Not Found | KhanaBook</title>
  <link rel="icon" type="image/png" href="../assets/khanabook_logo_header.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/home-v2.css?v=5">
  <script>
    (function(){try{var t=localStorage.getItem('khana-theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');if(t==='dark')document.documentElement.classList.add('dark');}catch(e){}})();
  </script>
  <style>
    .error-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 6rem 1.5rem; text-align: center; position: relative; overflow: hidden; }
    .error-bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
    .error-bg-blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .3; }
    .error-bg-blob-1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(108,39,217,.25) 0%, transparent 70%); top: -150px; right: -100px; }
    .error-bg-blob-2 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(245,158,11,.2) 0%, transparent 70%); bottom: -100px; left: -100px; }
    .error-inner { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; }
    .error-code { font-family: 'Space Grotesk', sans-serif; font-size: clamp(6rem,15vw,10rem); font-weight: 900; line-height: 1; color: var(--violet); opacity: .15; margin-bottom: -1.5rem; }
    .error-icon { width: 80px; height: 80px; border-radius: 20px; background: rgba(108,39,217,.1); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
    .error-icon .material-symbols-outlined { font-size: 2.5rem; color: var(--violet); }
    .error-page h1 { font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.6rem,3.5vw,2.4rem); font-weight: 800; line-height: 1.15; margin-bottom: .75rem; }
    .error-page p { font-size: 1rem; color: var(--text-muted); line-height: 1.7; margin-bottom: 2rem; }
    .error-actions { display: flex; flex-wrap: wrap; gap: .875rem; justify-content: center; }
    .error-search { display: flex; gap: .5rem; max-width: 400px; margin: 0 auto 2rem; }
    .error-search input { flex: 1; padding: .75rem 1rem; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: inherit; font-size: .95rem; }
    .error-search input:focus { outline: 2px solid var(--violet); outline-offset: 2px; }
    .error-search button { padding: .75rem 1.25rem; border-radius: 12px; border: none; background: var(--violet); color: #fff; font-weight: 600; cursor: pointer; }
    .popular-links { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; margin-top: 1.5rem; }
    .popular-links a { font-size: .875rem; color: var(--text-muted); text-decoration: underline; text-underline-offset: 3px; }
    .popular-links a:hover { color: var(--violet); }
  </style>
</head>
<body data-page-version="1.2.0">
  <main id="main-content">
    <div class="error-page">
      <div class="error-bg" aria-hidden="true">
        <div class="error-bg-blob error-bg-blob-1"></div>
        <div class="error-bg-blob error-bg-blob-2"></div>
      </div>
      <div class="error-inner">
        <div class="error-code" aria-hidden="true">404</div>
        <div class="error-icon">
          <span class="material-symbols-outlined" aria-hidden="true">search_off</span>
        </div>
        <h1>Oops! Page not found</h1>
        <p>The page you're looking for doesn't exist, has been moved, or is temporarily unavailable. Let's get you back on track.</p>
        <div class="error-search" role="search">
          <input type="text" id="error-search-input" placeholder="Search KhanaBook pages..." aria-label="Search the site">
          <button onclick="handleErrorSearch()">Search</button>
        </div>
        <div class="error-actions">
          <a href="home.html" class="btn-primary">
            <span class="material-symbols-outlined" style="font-size:1.1rem" aria-hidden="true">home</span>
            Back to Home
          </a>
          <a href="get-started.html" class="btn-secondary">
            <span class="material-symbols-outlined" style="font-size:1.1rem" aria-hidden="true">support</span>
            Contact Support
          </a>
        </div>
        <div class="popular-links">
          <span style="font-size:.875rem;color:var(--text-muted)">Popular:</span>
          <a href="features.html">Features</a>
          <a href="pricing-plans.html">Pricing</a>
          <a href="our-story.html">About Us</a>
          <a href="help-center.html">Help Center</a>
          <a href="blog.html">Blog</a>
          <a href="roi-calculator.html">ROI Calculator</a>
          <a href="vs-petpooja.html">Compare POS</a>
        </div>
      </div>
    </div>
  </main>
  <script>
    var sitePages = [
      { title: 'Home', url: 'home.html' },
      { title: 'Features', url: 'features.html' },
      { title: 'Pricing', url: 'pricing-plans.html' },
      { title: 'Blog', url: 'blog.html' },
      { title: 'Our Story', url: 'our-story.html' },
      { title: 'Help Center', url: 'help-center.html' },
      { title: 'Contact', url: 'get-started.html' },
      { title: 'Privacy Policy', url: 'legal-privacy.html' },
      { title: 'ROI Calculator', url: 'roi-calculator.html' },
      { title: 'Compare POS Systems', url: 'vs-petpooja.html' }
    ];
    function handleErrorSearch() {
      var q = document.getElementById('error-search-input').value.toLowerCase().trim();
      if (!q) return;
      var match = sitePages.filter(function(p) { return p.title.toLowerCase().indexOf(q) !== -1; });
      if (match.length) {
        window.location.href = match[0].url;
      } else {
        window.location.href = 'home.html';
      }
    }
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('error-search-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') handleErrorSearch();
      });
    });
  </script>
  <script src="../js/site.js?v=5"></script>
</body>
</html>
